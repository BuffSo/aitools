<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1749a6"/>
      <stop offset="55%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#2d7dd2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="rgba(0,180,216,0.16)"/>
      <stop offset="100%" stop-color="rgba(0,180,216,0)"/>
    </radialGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 로고(흰색 가로형)는 generate 스크립트에서 상단 중앙(폭 360, top=96)에 합성 -->

  <!-- 헤드라인 (썸네일에서도 읽히도록 크게, 가운데 정렬) -->
  <text x="600" y="356" text-anchor="middle" font-family="'Apple SD Gothic Neo', Pretendard, sans-serif" font-size="72" font-weight="800" fill="#ffffff">AI가 광고 성과를 분석하고</text>
  <text x="600" y="448" text-anchor="middle" font-family="'Apple SD Gothic Neo', Pretendard, sans-serif" font-size="72" font-weight="800" fill="url(#cyan)">스스로 의사결정합니다</text>

  <!-- 태그라인 (가운데 정렬, 한 줄) -->
  <text x="600" y="540" text-anchor="middle" font-family="'Apple SD Gothic Neo', Pretendard, sans-serif" font-size="34" font-weight="500" fill="rgba(255,255,255,0.80)">AI 광고 운영 자동화 솔루션</text>
</svg>
